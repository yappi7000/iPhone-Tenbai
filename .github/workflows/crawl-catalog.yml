name: Update multi-category buyback prices
on:
  schedule:
    - cron: '20 23 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog-buyback
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test extraction and ranking
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/catalog-core.test.js
      - name: Fetch public store prices
        run: python scripts/crawl_catalog.py
      - name: Commit catalog observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/catalog_prices.json data/pokemon_market.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update catalog buyback prices [skip ci]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Store coverage gate
        # コミットの後に実行する最終判定（価格の更新は止めない）。
        # 稼働中の店舗の取得0件（新規の取得障害）と全店舗の取得0件は、このワークフローを「失敗」として表示する。
        # 既知のアクセス制限（scripts/known_store_restrictions.json）による継続障害は警告として毎回表示する。
        if: always() && hashFiles('data/catalog_prices.json') != ''
        run: python scripts/catalog_health.py
