name: Update multi-category buyback prices
on:
  schedule:
    - cron: '20 23 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: iphone-price-crawler
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test extraction and ranking
        run: |
          python -m unittest discover -s tests -p 'test_catalog.py'
          node --test tests/catalog-core.test.js
      - name: Fetch public store prices
        run: python scripts/crawl_catalog.py
      - name: Commit catalog observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/catalog_prices.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update catalog buyback prices [skip ci]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
