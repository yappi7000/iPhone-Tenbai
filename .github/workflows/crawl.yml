name: Auto Crawl iPhone Prices

on:
  schedule:
    # 毎朝8:00 JST
    # GitHub ActionsのcronはUTCなので前日23:00 UTC
    - cron: '0 23 * * *'

  # GitHub画面から手動実行も可能
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iphone-price-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run crawler
        run: node scripts/crawler.js

      - name: Verify generated prices
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const data = JSON.parse(
            fs.readFileSync(
              'data/prices.json',
              'utf8'
            )
          );

          const jans = Object.keys(data);

          let total = 0;
          let bad = 0;

          for (const jan of jans) {
            const stores =
              Array.isArray(data[jan].stores)
                ? data[jan].stores
                : [];

            total += stores.length;

            const unique =
              new Set(
                stores.map(x => x.store)
              );

            if (
              stores.length !== 12 ||
              unique.size !== 12
            ) {
              bad++;
            }
          }

          console.log(
            'SKU数:',
            jans.length
          );

          console.log(
            '価格総数:',
            total
          );

          console.log(
            '異常SKU:',
            bad
          );

          if (
            jans.length !== 32 ||
            total !== 384 ||
            bad !== 0
          ) {
            console.error(
              'prices.json verification failed'
            );

            process.exit(1);
          }

          console.log(
            'DIRECT CRAWLER COMPLETE'
          );
          NODE

      - name: Commit and push updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/prices.json
          git add data/crawl_diagnostics.json

          if git diff --cached --quiet; then
            echo "価格変更なし"
            exit 0
          fi

          git commit -m "Update iPhone prices [skip ci]"
          git push
