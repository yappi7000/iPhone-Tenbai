name: Auto Crawl iPhone Prices

on:
  schedule:
    # 毎朝8:00 JST
    # GitHub ActionsのcronはUTCなので前日23:00 UTC
    - cron: '0 23 * * *'

  # GitHub画面から手動実行も可能
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iphone-price-data
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select browser
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "Using system Google Chrome"
            google-chrome --version
            echo "PLAYWRIGHT_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            echo "System Chrome not found - installing Playwright Chromium"
            npx playwright install --with-deps --only-shell chromium
          fi

      - name: Test price rules and verification
        run: node --test tests/verify-prices.test.js tests/price-freshness.test.js

      - name: Save previous prices for comparison
        run: cp data/prices.json "$RUNNER_TEMP/previous_prices.json"

      - name: Run crawler
        env:
          SKIP_IPHONE17: "1"
        run: node scripts/crawler.js

      - name: Verify generated prices
        # 検証条件は scripts/verify_prices.js と scripts/price_rules.js を参照
        # （取得率の閾値は過去実績に基づく。根拠は price_rules.js のコメント）
        run: |
          export VERIFY_REPORT_PATH="$RUNNER_TEMP/verify_report.md"
          node scripts/verify_prices.js \
            --prices data/prices.json \
            --diagnostics data/crawl_diagnostics.json \
            --index index.html \
            --previous "$RUNNER_TEMP/previous_prices.json"

      - name: Keep crawl results (also when verification fails)
        # 検証失敗時は prices.json をコミットしない（公開データは前回のまま）。
        # その回に取得できた価格・診断・検証レポートは成果物として30日保存し、
        # 原因調査や結果の確認ができるようにする（公開はしない）。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-results-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            data/prices.json
            data/crawl_diagnostics.json
            ${{ runner.temp }}/verify_report.md
          retention-days: 30
          if-no-files-found: warn

      - name: Commit and push updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/prices.json
          git add data/crawl_diagnostics.json

          if git diff --cached --quiet; then
            echo "価格変更なし"
            exit 0
          fi

          git commit -m "Update iPhone prices [skip ci]"

          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"

          git push origin "HEAD:${GITHUB_REF_NAME}"
