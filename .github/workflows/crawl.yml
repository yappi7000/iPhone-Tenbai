name: Auto Crawl iPhone Prices

on:
  schedule:
    # 毎朝8:00 JST
    # GitHub ActionsのcronはUTCなので前日23:00 UTC
    - cron: '0 23 * * *'

  # GitHub画面から手動実行も可能
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iphone-price-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run crawler
        run: node scripts/crawler.js

      - name: Verify generated prices
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const data = JSON.parse(
            fs.readFileSync(
              'data/prices.json',
              'utf8'
            )
          );

          const html = fs.readFileSync(
            'index.html',
            'utf8'
          );

          /*
           * 表示対象の
           * iPhone 18 Pro / Pro Max
           * 32 SKUだけを検証する。
           */
          const pattern =
            /"iPhone 18 Pro(?: Max)?_(?:256GB|512GB|1TB|2TB)_(?:ブラック|シルバー|バーガンディ|グレイシャー)"\s*:\s*"(\d{13})"/g;

          const targetJans =
            [...html.matchAll(pattern)]
              .map(match => match[1]);

          const uniqueJans =
            new Set(targetJans);

          if (
            targetJans.length !== 32 ||
            uniqueJans.size !== 32
          ) {
            console.error(
              'iPhone 18 target JAN verification failed:',
              targetJans.length,
              uniqueJans.size
            );

            process.exit(1);
          }

          let bad = 0;
          let available = 0;

          for (const jan of targetJans) {
            const item = data[jan];

            const stores =
              item &&
              Array.isArray(item.stores)
                ? item.stores
                : [];

            /*
             * 価格0件のSKUは異常。
             */
            if (stores.length === 0) {
              console.error(
                `${jan}: no valid prices`
              );

              bad++;
              continue;
            }

            const names =
              new Set();

            for (const store of stores) {
              const name =
                String(
                  store.store || ''
                ).trim();

              const price =
                Number(store.price);

              if (
                !name ||
                names.has(name) ||
                !Number.isFinite(price) ||
                price < 50000 ||
                price > 500000
              ) {
                console.error(
                  `${jan}: invalid price row`,
                  store
                );

                bad++;
                continue;
              }

              names.add(name);
              available++;
            }
          }

          console.log(
            'iPhone 18 SKU数:',
            targetJans.length
          );

          console.log(
            '利用可能価格数:',
            available
          );

          console.log(
            '異常:',
            bad
          );

          console.log(
            'prices.json 全SKU数:',
            Object.keys(data).length
          );

          if (
            bad !== 0 ||
            available === 0
          ) {
            console.error(
              'prices.json safety verification failed'
            );

            process.exit(1);
          }

          console.log(
            'SAFE CRAWLER VERIFY COMPLETE'
          );
          NODE

      - name: Commit and push updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/prices.json
          git add data/crawl_diagnostics.json

          if git diff --cached --quiet; then
            echo "価格変更なし"
            exit 0
          fi

          git commit -m "Update iPhone prices [skip ci]"
          git push
