name: Update selected iPhone price

on:
  workflow_dispatch:
    inputs:
      jan:
        description: 'JAN code'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: iphone-price-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync latest main
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select browser
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "Using system Google Chrome"
            google-chrome --version
            echo "PLAYWRIGHT_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            echo "System Chrome not found - installing Playwright Chromium"
            npx playwright install --with-deps --only-shell chromium
          fi

      - name: Save previous prices for comparison
        run: cp data/prices.json "$RUNNER_TEMP/previous_prices.json"

      - name: Update selected iPhone
        env:
          TARGET_JAN: ${{ inputs.jan }}
          SKIP_IPHONE17: "1"
        run: node scripts/crawler.js

      - name: Verify selected JAN
        # 定時実行と同じ検証スクリプトをオンデマンドモードで実行。
        # 価格0件は「価格未取得」として保存し（古い価格は出さない）、
        # 他SKUが書き換わっていないこともここで確認する。
        env:
          TARGET_JAN: ${{ inputs.jan }}
        run: |
          export VERIFY_REPORT_PATH="$RUNNER_TEMP/verify_report.md"
          node scripts/verify_prices.js \
            --prices data/prices.json \
            --diagnostics data/crawl_diagnostics.json \
            --index index.html \
            --previous "$RUNNER_TEMP/previous_prices.json" \
            --target-jan "$TARGET_JAN"

      - name: Keep crawl results (also when verification fails)
        # 検証失敗時は prices.json をコミットしない（公開データは前回のまま）。
        # その回に取得できた価格・診断・検証レポートは成果物として30日保存し、
        # 原因調査や結果の確認ができるようにする（公開はしない）。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: on-demand-results-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            data/prices.json
            data/crawl_diagnostics.json
            ${{ runner.temp }}/verify_report.md
          retention-days: 30
          if-no-files-found: warn

      - name: Commit updated price
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add data/prices.json
          git add data/crawl_diagnostics.json

          if git diff --cached --quiet; then
            echo "No price changes"
            exit 0
          fi

          git commit -m "Update selected iPhone price [skip ci]"

          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"

          git push origin "HEAD:${GITHUB_REF_NAME}"

